<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Paystream — River</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=Instrument+Serif:ital@0;1&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#AFC6FF}a:hover{color:#E8ECF7}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.tg{min-height:36px;min-width:52px;padding:0 10px;border:0;border-radius:999px;font:600 13px 'Instrument Sans',sans-serif;cursor:pointer}
.tg:focus-visible,.sal:focus-visible,.go:focus-visible{outline:2px solid #6FA8FF;outline-offset:2px}
.track{position:relative;height:14px;flex:1}
.line{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);border-radius:3px;opacity:.28}
.drop{position:absolute;top:50%;border-radius:50%}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B1020; color: #E8ECF7; font-family: 'Instrument Sans', sans-serif; display: flex; flex-direction: column; gap: 16px; padding: 18px 20px 16px; overflow: hidden">

  <header style="display: flex; justify-content: space-between; align-items: center">
    <div style="font-weight: 600; font-size: 19px; letter-spacing: -0.01em">pay<span style="color: #5BD69B">stream</span></div>
    <div role="group" aria-label="Which clock" style="display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: #131A2E">
      <button type="button" class="tg" aria-pressed="{{isYear}}" onClick="{{setYear}}" style="{{yearStyle}}">24 h</button>
      <button type="button" class="tg" aria-pressed="{{isWork}}" onClick="{{setWork}}" style="{{workStyle}}">At work</button>
    </div>
  </header>

  <div style="display: flex; align-items: center; gap: 10px; background: #131A2E; border-radius: 14px; padding: 4px 6px 4px 14px">
    <label for="salary-b" style="font-size: 13px; color: #8A93AD; white-space: nowrap">Salary</label>
    <input id="salary-b" class="sal mono" inputmode="numeric" autocomplete="off" value="{{salaryText}}" onChange="{{onSalary}}" style="flex: 1; min-width: 0; min-height: 44px; border: 0; background: transparent; color: #E8ECF7; font: 500 20px 'JetBrains Mono', monospace">
    <span title="Stays in your browser — nothing is sent anywhere." style="display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: #8A93AD; padding-right: 6px">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
      private
    </span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 4px">
    <div style="font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #5BD69B">To you</div>
    <div style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: 58px; line-height: .95; letter-spacing: -0.01em">1¢ every {{you.every}}</div>
    <div class="mono" style="font-size: 12px; color: #8A93AD; margin-top: 4px">{{you.perHour}} · {{you.perDay}}</div>
  </div>

  <section aria-label="Where each penny goes" style="position: relative; display: flex; flex-direction: column; gap: 0">
    <div class="mono" style="font-size: 11px; color: #8A93AD; padding-left: 0; margin-bottom: 4px">{{grossText}} in ↓</div>
    <svg width="28" height="292" viewBox="0 0 28 292" aria-hidden="true" style="position: absolute; left: 0; top: 22px">
      <path d="M3 0 V262" stroke="#3A4566" stroke-width="2" fill="none"></path>
      <path d="M3 10 Q3 38 26 38" stroke="#5BD69B" stroke-width="3" fill="none"></path>
      <path d="M3 66 Q3 94 26 94" stroke="#6FA8FF" stroke-width="2" fill="none"></path>
      <path d="M3 122 Q3 150 26 150" stroke="#FFB15C" stroke-width="2" fill="none"></path>
      <path d="M3 178 Q3 206 26 206" stroke="#C49BFF" stroke-width="2" fill="none"></path>
      <path d="M3 234 Q3 262 26 262" stroke="#FF7FA8" stroke-width="2" fill="none"></path>
    </svg>
    <sc-for list="{{lanes}}" as="l" hint-placeholder-count="5">
      <div style="height: 56px; padding-left: 34px; display: flex; flex-direction: column; justify-content: center; gap: 4px; box-sizing: border-box">
        <div style="display: flex; justify-content: space-between; font-size: 13px">
          <span style="font-weight: 600; color: {{l.color}}">{{l.label}}</span>
          <span class="mono" style="color: #C9D0E3">1¢ / {{l.every}}</span>
        </div>
        <div style="display: flex; align-items: center; gap: 10px">
          <div class="track">
            <div class="line" style="height: {{l.thick}}px; background: {{l.color}}"></div>
            <sc-for list="{{l.drops}}" as="dp" hint-placeholder-count="5">
              <span class="drop" style="left: {{dp.x}}%; width: {{l.size}}px; height: {{l.size}}px; margin: -{{l.half}}px 0 0 -{{l.half}}px; background: {{l.color}}; opacity: {{dp.op}}"></span>
            </sc-for>
          </div>
          <span class="mono" style="width: 44px; text-align: right; font-size: 12px; color: #E8ECF7">{{l.pennies}}¢</span>
        </div>
      </div>
    </sc-for>
  </section>

  <section style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: #8A93AD">
      <span>Since you got here</span>
      <span class="mono"><span style="color: #5BD69B">{{youSince}}</span> you · {{taxSince}} taxes</span>
    </div>
    <a class="go" href="RiverCompare.dc.html" style="min-height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-radius: 14px; background: #131A2E; text-decoration: none; font-weight: 600; font-size: 15px; color: #E8ECF7">
      Compare with capital gains
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </a>
    <p style="margin: 0; font-size: 11px; color: #6B7491">Illustrative 2026 figures · single filer · state 5% typed in</p>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  data() {
    return {
      base: 75000,
      annual: { you: 57842.5, fed: 7670, ss: 4650, state: 3750, med: 1087.5 },
      seconds: { year: 31536000, work: 7488000 },
      lanes: [
        { key: 'you', label: 'You', color: '#5BD69B', thick: 6, size: 11 },
        { key: 'fed', label: 'Federal', color: '#6FA8FF', thick: 3, size: 8 },
        { key: 'ss', label: 'Social Security', color: '#FFB15C', thick: 3, size: 8 },
        { key: 'state', label: 'State', color: '#C49BFF', thick: 3, size: 8 },
        { key: 'med', label: 'Medicare', color: '#FF7FA8', thick: 3, size: 8 }
      ]
    };
  }
  every(s) {
    if (!isFinite(s)) return '—';
    if (s < 10) return s.toFixed(1) + ' s';
    if (s < 90) return Math.round(s) + ' s';
    if (s < 3600) return Math.floor(s / 60) + 'm ' + Math.round(s % 60) + 's';
    return (s / 3600).toFixed(1) + ' h';
  }
  componentDidMount() {
    var self = this;
    this.setState({ start: Date.now() - 240000, now: Date.now() });
    var tick = function () { self.setState({ now: Date.now() }); self.raf = requestAnimationFrame(tick); };
    this.raf = requestAnimationFrame(tick);
  }
  componentWillUnmount() { cancelAnimationFrame(this.raf); }
  renderVals() {
    var self = this, d = this.data(), st = this.state || {};
    var mode = st.mode || 'year';
    var salary = st.salary == null ? d.base : st.salary;
    var now = st.now || Date.now();
    var elapsed = (now - (st.start || now - 240000)) / 1000;
    var scale = salary / d.base;
    var taxRate = 0, youRate = 0;
    var lanes = d.lanes.map(function (l) {
      var rate = d.annual[l.key] * scale / d.seconds[mode];
      var cents = rate * elapsed * 100;
      var whole = Math.floor(cents), p = cents - whole;
      if (l.key === 'you') youRate = rate; else taxRate += rate;
      var drops = [];
      for (var k = 0; k < 5; k++) {
        var x = (k + p) / 5;
        drops.push({ x: (x * 100).toFixed(2), op: Math.min(1, x * 4).toFixed(2) });
      }
      return {
        label: l.label, color: l.color, thick: l.thick, size: l.size, half: l.size / 2,
        every: self.every(rate > 0 ? 0.01 / rate : Infinity),
        pennies: whole, drops: drops
      };
    });
    var on = 'background:#E8ECF7;color:#0B1020', off = 'background:transparent;color:#C9D0E3';
    return {
      salaryText: salary ? '$' + salary.toLocaleString('en-US') : '',
      onSalary: function (e) {
        var v = parseInt(String(e.target.value).replace(/[^0-9]/g, ''), 10);
        self.setState({ salary: isNaN(v) ? 0 : Math.min(v, 99999999) });
      },
      isYear: mode === 'year', isWork: mode === 'work',
      yearStyle: mode === 'year' ? on : off, workStyle: mode === 'work' ? on : off,
      setYear: function () { self.setState({ mode: 'year' }); },
      setWork: function () { self.setState({ mode: 'work' }); },
      grossText: '$' + salary.toLocaleString('en-US'),
      you: {
        every: this.every(youRate > 0 ? 0.01 / youRate : Infinity),
        perHour: '$' + (youRate * 3600).toFixed(2) + (mode === 'work' ? ' an hour at work' : ' an hour'),
        perDay: '$' + (d.annual.you * scale / (mode === 'work' ? 260 : 365)).toFixed(2) + (mode === 'work' ? ' a workday' : ' a day')
      },
      lanes: lanes,
      youSince: '$' + (youRate * elapsed).toFixed(4),
      taxSince: '$' + (taxRate * elapsed).toFixed(4)
    };
  }
}
</script>
</body>
</html>
