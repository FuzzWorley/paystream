<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Paystream — Arcade</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=VT323&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFE14D}a:hover{color:#fff}
.px{font-family:'Press Start 2P',monospace}
.vt{font-family:'VT323',monospace;font-variant-numeric:tabular-nums}
.screen{position:relative}
.screen::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:22px;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.035) 0 1px,transparent 1px 3px);box-shadow:inset 0 0 60px rgba(0,0,0,.75)}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.spin{animation:spin .8s steps(4) infinite}
@keyframes spin{0%{transform:scaleX(1)}50%{transform:scaleX(.15)}100%{transform:scaleX(1)}}
.pb{min-height:44px;flex:1;border:3px solid #3EE8FF;background:transparent;color:#3EE8FF;font:10px 'Press Start 2P',monospace;cursor:pointer}
.pb:focus-visible,.lcd:focus-visible,.start:focus-visible{outline:3px solid #FFE14D;outline-offset:3px}
.blk{width:100%;height:6px}
@media (prefers-reduced-motion: reduce){.blink,.spin{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #07060B; padding: 12px; display: flex">
  <div class="screen" style="flex: 1; border-radius: 22px; background: radial-gradient(ellipse at 50% 35%, #1A1430 0%, #0C0A14 70%); color: #F4F1FF; display: flex; flex-direction: column; gap: 14px; padding: 18px 16px 16px; overflow: hidden">

    <div style="display: flex; justify-content: space-between; align-items: center">
      <span class="px blink" style="font-size: 10px; color: #FF3EA5">1UP</span>
      <span class="px" style="font-size: 9px; color: #8C85A8">CREDIT <span style="color: #FFE14D">{{credit}}</span></span>
    </div>

    <div style="display: flex; align-items: center; justify-content: center; gap: 12px">
      <span class="spin" aria-hidden="true" style="width: 26px; height: 26px; border-radius: 50%; background: #FFE14D; box-shadow: inset -4px -4px 0 #C99A12, inset 4px 4px 0 #FFF3A6; display: inline-block"></span>
      <h1 class="px" style="margin: 0; font-size: 25px; font-weight: 400; color: #FFE14D; text-shadow: 3px 3px 0 #FF3EA5, 6px 6px 0 rgba(62,232,255,.5); letter-spacing: 1px">PAYSTREAM</h1>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="salary-c" class="px" style="font-size: 10px; color: #3EE8FF; text-align: center">INSERT SALARY</label>
      <input id="salary-c" class="lcd vt" inputmode="numeric" autocomplete="off" value="{{salaryText}}" onChange="{{onSalary}}" style="min-height: 56px; border: 3px solid #3EE8FF; background: #07060B; color: #6BFF8A; font-size: 44px; text-align: center; padding: 0; text-shadow: 0 0 8px rgba(107,255,138,.6)">
      <div class="vt" style="font-size: 16px; color: #8C85A8; text-align: center">YOUR NUMBERS NEVER LEAVE THIS MACHINE</div>
    </div>

    <div role="group" aria-label="Which clock" style="display: flex; gap: 8px">
      <button type="button" class="pb" aria-pressed="{{isYear}}" onClick="{{setYear}}" style="{{yearStyle}}">24 HOURS</button>
      <button type="button" class="pb" aria-pressed="{{isWork}}" onClick="{{setWork}}" style="{{workStyle}}">9 TO 5</button>
    </div>

    <section aria-label="High scores" style="display: flex; flex-direction: column; gap: 9px">
      <div class="px" style="font-size: 12px; text-align: center; color: #FF3EA5">HIGH SCORES</div>
      <div class="px" style="display: grid; grid-template-columns: 36px minmax(0, 1fr) 88px 70px; font-size: 7px; color: #8C85A8; gap: 6px">
        <span>RANK</span><span>NAME</span><span>RATE</span><span style="text-align: right">SCORE</span>
      </div>
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <div style="display: grid; grid-template-columns: 36px minmax(0, 1fr) 88px 70px; gap: 6px; align-items: baseline; color: {{r.color}}">
            <span class="px" style="font-size: 9px">{{r.rank}}</span>
            <span class="px" style="font-size: 9px; white-space: nowrap; overflow: hidden">{{r.name}}</span>
            <span class="vt" style="font-size: 20px">1¢/{{r.every}}</span>
            <span class="vt" style="font-size: 22px; text-align: right">{{r.score}}</span>
          </div>
          <div style="display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 2px" aria-hidden="true">
            <sc-for list="{{r.blocks}}" as="b" hint-placeholder-count="12"><span class="blk" style="background: {{b.bg}}"></span></sc-for>
          </div>
        </div>
      </sc-for>
    </section>

    <div style="margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 10px">
      <span class="px" aria-live="polite" style="font-size: 11px; color: #FFE14D; opacity: {{popOp}}">+1¢ TO YOU</span>
      <a class="start px blink" href="ArcadeGames.dc.html" style="min-height: 44px; display: inline-flex; align-items: center; padding: 0 12px; font-size: 13px; text-decoration: none; color: #F4F1FF">PRESS START</a>
      <div class="vt" style="font-size: 15px; color: #6B6585">ILLUSTRATIVE 2026 · SINGLE · STATE 5%</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  data() {
    return {
      base: 75000,
      annual: { you: 57842.5, fed: 7670, ss: 4650, state: 3750, med: 1087.5 },
      seconds: { year: 31536000, work: 7488000 },
      rows: [
        { key: 'you', rank: '1ST', name: 'YOU', color: '#FFE14D' },
        { key: 'fed', rank: '2ND', name: 'FEDERAL', color: '#3EE8FF' },
        { key: 'ss', rank: '3RD', name: 'SOC SEC', color: '#FF8A3D' },
        { key: 'state', rank: '4TH', name: 'STATE', color: '#FF3EA5' },
        { key: 'med', rank: '5TH', name: 'MEDICARE', color: '#6BFF8A' }
      ]
    };
  }
  every(s) {
    if (!isFinite(s)) return '--';
    if (s < 10) return s.toFixed(1) + 'S';
    if (s < 100) return Math.round(s) + 'S';
    return Math.floor(s / 60) + 'M' + Math.round(s % 60) + 'S';
  }
  pad(n) { var s = String(n); while (s.length < 6) s = '0' + s; return s; }
  componentDidMount() {
    var self = this;
    this.setState({ start: Date.now() - 240000, now: Date.now() });
    var tick = function () { self.setState({ now: Date.now() }); self.raf = requestAnimationFrame(tick); };
    this.raf = requestAnimationFrame(tick);
  }
  componentWillUnmount() { cancelAnimationFrame(this.raf); }
  renderVals() {
    var self = this, d = this.data(), st = this.state || {};
    var mode = st.mode || 'year';
    var salary = st.salary == null ? d.base : st.salary;
    var now = st.now || Date.now();
    var elapsed = (now - (st.start || now - 240000)) / 1000;
    var scale = salary / d.base;
    var youP = 0, youWhole = 0;
    var rows = d.rows.map(function (r) {
      var rate = d.annual[r.key] * scale / d.seconds[mode];
      var cents = rate * elapsed * 100, whole = Math.floor(cents), p = cents - whole;
      if (r.key === 'you') { youP = p; youWhole = whole; }
      var lit = Math.floor(p * 12), blocks = [];
      for (var i = 0; i < 12; i++) blocks.push({ bg: i < lit ? r.color : '#2A2340' });
      return {
        rank: r.rank, name: r.name, color: r.color,
        every: self.every(rate > 0 ? 0.01 / rate : Infinity),
        score: self.pad(whole), blocks: blocks
      };
    });
    var on = 'background:#3EE8FF;color:#07060B', off = 'background:transparent;color:#3EE8FF';
    return {
      salaryText: salary ? '$' + salary.toLocaleString('en-US') : '',
      onSalary: function (e) {
        var v = parseInt(String(e.target.value).replace(/[^0-9]/g, ''), 10);
        self.setState({ salary: isNaN(v) ? 0 : Math.min(v, 99999999) });
      },
      isYear: mode === 'year', isWork: mode === 'work',
      yearStyle: mode === 'year' ? on : off, workStyle: mode === 'work' ? on : off,
      setYear: function () { self.setState({ mode: 'year' }); },
      setWork: function () { self.setState({ mode: 'work' }); },
      rows: rows,
      credit: this.pad(youWhole).slice(2),
      popOp: Math.max(0, 1 - youP * 3).toFixed(2)
    };
  }
}
</script>
</body>
</html>
